name: Windows VST3
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  vst3:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE 7 / MSVC x64
        run: cmake -S Lexicon224 -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath windows-build.log
          exit $LASTEXITCODE
      - name: Build diagnostic summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path windows-build.log) {
            '## Windows compiler diagnostics' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```text' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content windows-build.log | Select-String -Pattern 'error C|fatal error|error LNK|error MSB|FAILED' | Select-Object -First 60 | ForEach-Object {
              $_.Line | Out-File -Append $env:GITHUB_STEP_SUMMARY
              $message = $_.Line.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Output "::error::$message"
            }
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package complete VST3 bundle
        shell: pwsh
        run: Compress-Archive -Path build/Lexicon224_artefacts/Release/VST3/Lexicon224.vst3,docs/preset-readiness-audit.json -DestinationPath Lexicon224-Windows-x64-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lexicon224-Windows-x64-VST3
          path: Lexicon224-Windows-x64-VST3.zip
          if-no-files-found: error
      - name: Publish downloadable Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.2.2 --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.2.2 --repo $env:GH_REPO --target $env:GITHUB_SHA --title "Lexicon224 v0.2.2 - Windows x64" --notes-file .github/release-notes.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload v0.2.2 Lexicon224-Windows-x64-VST3.zip --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
