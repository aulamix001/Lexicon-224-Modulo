name: Windows VST3
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  vst3:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE 7 / MSVC x64
        run: cmake -S Lexicon224 -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package complete VST3 bundle
        shell: pwsh
        run: Compress-Archive -Path build/Lexicon224_artefacts/Release/VST3/Lexicon224.vst3 -DestinationPath Lexicon224-Windows-x64-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lexicon224-Windows-x64-VST3
          path: Lexicon224-Windows-x64-VST3.zip
          if-no-files-found: error
      - name: Publish downloadable Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.1.0 --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.1.0 --repo $env:GH_REPO --target $env:GITHUB_SHA --title "Lexicon224 v0.1.0 - Windows x64" --notes-file .github/release-notes.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload v0.1.0 Lexicon224-Windows-x64-VST3.zip --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
